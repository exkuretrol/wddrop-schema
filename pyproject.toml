[project]
name = "wddrop-schema"
version = "0.1.0"
description = "Wire format shared by the wddrop client and server"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = ["pydantic>=2.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wddrop_schema"]
